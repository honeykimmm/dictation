    --bg: #EDF2F1;
    --paper: #FFFFFF;
    --ink: #1F2A37;
    --ink-soft: #5B6675;
    --line: #DCE3E1;

<script>

const CONFIG_IS_PLACEHOLDER = firebaseConfig.apiKey === "YOUR_API_KEY";
let db, storage;
if (!CONFIG_IS_PLACEHOLDER) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  try { storage = firebase.storage(); } catch(e) { storage = null; } // Storage 미설정이어도 Firestore는 정상 동작
}

/* =========================================================
   2. 상태
   ========================================================= */
const state = {
  view: 'home',       // home | teacherCreate | teacherSets | teacherResults | studentEntry | studentQuiz | studentResult
  currentSet: null,   // {id, code, title, segments, audioUrl}
  currentSetId: null,
  studentName: '',
  lastGrade: null,    // {score, total, segments(graded)}
  banner: null,
  audioMode: 'url',   // url | upload
  bulkSets: []        // Word 일괄 가져오기로 인식된 세트 목록
};

/* =========================================================
   3. 유틸
   ========================================================= */
function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalize(str){
  return (str||'').trim().toLowerCase().replace(/\s+/g,' ');
}
function genCode(len=6){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let out = '';
  for(let i=0;i<len;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}
// {정답} 형식으로 표시된 스크립트를 세그먼트 배열로 변환
function parseScript(raw){
  const segments = [];
  const regex = /\{([^}]+)\}/g;
  let lastIndex = 0, match, blankIndex = 0;
  while((match = regex.exec(raw)) !== null){
    if(match.index > lastIndex){
      segments.push({ type:'text', value: raw.slice(lastIndex, match.index) });
    }
    segments.push({ type:'blank', answer: match[1].trim(), index: blankIndex++ });
    lastIndex = regex.lastIndex;
  }
  if(lastIndex < raw.length){
    segments.push({ type:'text', value: raw.slice(lastIndex) });
  }
  return segments;
}
function blankCount(segments){
  return segments.filter(s => s.type === 'blank').length;
}

// Word(.docx)에서 밑줄 친 단어를 {정답} 형식 스크립트로 변환
function docxNodeChildrenToScript(el){
  let out = '';
  el.childNodes.forEach(n => out += docxNodeToScript(n));
  return out;
}
function docxNodeToScript(node){
  if(node.nodeType === Node.TEXT_NODE) return node.textContent;
  if(node.nodeName === 'U'){
    const raw = node.textContent;
    const leading = raw.match(/^\s*/)[0];
    const trailing = raw.match(/\s*$/)[0];
    const core = raw.trim();
    if(!core) return raw; // 공백만 밑줄 친 경우 그대로 둠
    return leading + '{' + core + '}' + trailing;
  }
  return docxNodeChildrenToScript(node);
}

// Word(.docx) 한 파일 안에 여러 딕테이션이 있을 때, 하이라이트(형광펜) 친 제목 문단을 기준으로 분리
async function docxToScripts(file){
  const arrayBuffer = await file.arrayBuffer();
  const result = await mammoth.convertToHtml({ arrayBuffer }, { styleMap: ["u => u", "highlight => mark"] });
  const container = document.createElement('div');
  container.innerHTML = result.value;
  const paragraphs = Array.from(container.querySelectorAll('p'));

  const sets = [];
  let current = null;
  paragraphs.forEach(p => {
    const isTitle = !!p.querySelector('mark');
    if(isTitle){
      current = { title: p.textContent.trim() || `세트 ${sets.length+1}`, lines: [] };
      sets.push(current);
      return;
    }
    if(!current){
      current = { title: '(제목 없음)', lines: [] };
      sets.push(current);
    }
    const line = docxNodeChildrenToScript(p);
    if(line.trim()) current.lines.push(line);
  });
  return sets
    .map(s => ({ title: s.title, script: s.lines.join('\n').trim() }))
    .filter(s => s.script);
}
function renderTextSegment(value){
  return escapeHtml(value).replace(/\n/g, '<br>');
}
function setBanner(type, msg){ state.banner = {type, msg}; }

/* =========================================================
   4. Firestore / Storage 연동
   ========================================================= */
async function createSet(title, rawScript, audioUrl){
  const segments = parseScript(rawScript);
  const code = genCode();
  const docRef = await db.collection('dictationSets').add({
    title, code, segments, audioUrl,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  return { id: docRef.id, code };
}
async function fetchSets(){
  const snap = await db.collection('dictationSets').orderBy('createdAt','desc').limit(50).get();
  return snap.docs.map(d => ({ id:d.id, ...d.data() }));
}
async function fetchSetById(id){
  const doc = await db.collection('dictationSets').doc(id).get();
  if(!doc.exists) return null;
  return { id: doc.id, ...doc.data() };
}
async function fetchSetByCode(code){
  const snap = await db.collection('dictationSets').where('code','==', code.trim().toUpperCase()).limit(1).get();
  if(snap.empty) return null;
  const d = snap.docs[0];
  return { id: d.id, ...d.data() };
}
async function saveSubmission(setId, studentName, score, total, answers){
  await db.collection('dictationSets').doc(setId).collection('submissions').add({
    studentName, score, total, answers,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}
async function fetchSubmissions(setId){
  const snap = await db.collection('dictationSets').doc(setId).collection('submissions').orderBy('score','desc').get();
  return snap.docs.map(d => ({ id:d.id, ...d.data() }));
}
async function uploadAudioFile(file){
  const path = 'dictation-audio/' + Date.now() + '_' + file.name.replace(/[^\w.\-]/g,'_');
  const ref = storage.ref().child(path);
  await ref.put(file);
  return await ref.getDownloadURL();
}

/* =========================================================
   5. 라우팅 / 렌더 루트
   ========================================================= */
function goto(view, extra){
  state.view = view;
  Object.assign(state, extra||{});
  render();
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = renderHeader() + renderBanner() + renderView();
  attachHandlers();
}

function renderHeader(){
  return `
  <div class="app-header">
    <div class="brand-mark"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
    <div>
      <div class="app-title">딕테이션 자동채점</div>
      <div class="app-sub">음원 듣고 빈칸 채우기 · 자동 채점 · 결과 저장</div>
    </div>
  </div>`;
}

function renderBanner(){
  if(!state.banner) return '';
  const b = state.banner;
  const cls = b.type === 'error' ? 'banner-error' : b.type === 'success' ? 'banner-success' : 'banner-warn';
  return `<div class="banner ${cls}">${escapeHtml(b.msg)}</div>`;
}

function renderView(){
  if(CONFIG_IS_PLACEHOLDER){
    return `
    <div class="banner banner-warn">
      <b>설정이 필요해요.</b> 코드 상단의 <code>firebaseConfig</code> 값을 본인의 Firebase 프로젝트 정보로 바꿔주세요.
      Firestore와 Storage를 프로젝트에서 사용 설정한 뒤 다시 열어보세요.
    </div>`;
  }
  switch(state.view){
    case 'home': return renderHome();
    case 'teacherCreate': return renderTeacherCreate();
    case 'teacherBulkImport': return renderTeacherBulkImport();
    case 'teacherSets': return renderTeacherSets();
    case 'teacherResults': return renderTeacherResultsShell();
    case 'studentEntry': return renderStudentEntryShell();
    case 'studentQuiz': return renderStudentQuiz();
    case 'studentResult': return renderStudentResult();
    default: return renderHome();
  }
}

/* ---- TEACHER: CREATE ---- */
function renderTeacherCreate(){
  return `
  ${renderBackRow()}
  ${renderTeacherTabs('create')}
  <div class="card">
    <div class="eyebrow">새 딕테이션 만들기</div>
    <h2>세트 정보 입력</h2>
    <p class="muted">스크립트에서 정답으로 쓸 단어(구)는 <b>{ }</b> 로 감싸주세요. 여러 단어도 하나의 빈칸으로 묶을 수 있어요.</p>

    <label class="field">
      <span class="flabel">세트 제목</span>
      <input class="input" id="f-title" placeholder="예: Unit 5 Dictation - 여행 표현">

    <label class="field">
      <span class="flabel">딕테이션 스크립트</span>
      <div class="btn-row" style="margin-bottom:10px;">
        <input type="file" id="f-docx-file" accept=".docx" style="display:none;">

        <label><input type="radio" name="audioMode" value="upload" ${state.audioMode==='upload'?'checked':''}><span>파일 업로드</span></label>

    <div class="btn-row">

async function loadTeacherSets(){
  const area = document.getElementById('sets-list-area');
  if(!area) return;
  try{
    const sets = await fetchSets();
    if(sets.length === 0){
      area.innerHTML = `<div class="empty-state">아직 만든 딕테이션 세트가 없어요.<br>‘새로 만들기’에서 첫 세트를 만들어보세요.</div>`;
      return;
    }
    area.innerHTML = sets.map(s => `
      <div class="set-row">
        <div>
          <div class="set-title">${escapeHtml(s.title||'(제목 없음)')}</div>
          <div class="set-meta">빈칸 ${blankCount(s.segments||[])}개 · 코드 <span class="code-pill">${escapeHtml(s.code)}</span></div>

        <button class="btn btn-ghost" data-goto-results="${s.id}">결과 보기</button>
      </div>

    area.innerHTML = `<div class="banner banner-error">목록을 불러오지 못했어요: ${escapeHtml(e.message)}</div>`;
  }
}

async function loadTeacherResults(){
  const area = document.getElementById('results-area');
  if(!area || !state.currentSetId) return;
  try{
    const [set, subs] = await Promise.all([
      fetchSetById(state.currentSetId),
      fetchSubmissions(state.currentSetId)
    ]);
    if(!set){ area.innerHTML = `<div class="empty-state">세트를 찾을 수 없어요.</div>`; return; }
    const link = location.origin + location.pathname + '?set=' + set.id;
    const rows = subs.map(s => `
      <tr>
        <td>${escapeHtml(s.studentName)}</td>
        <td>${s.score} / ${s.total}</td>
        <td>${s.total ? Math.round(s.score/s.total*100) : 0}%</td>
      </tr>`).join('');
    area.innerHTML = `
      <div class="eyebrow">결과 보기</div>
      <h2>${escapeHtml(set.title||'(제목 없음)')}</h2>
      <p class="muted">학생 공유 코드 <span class="code-pill">${escapeHtml(set.code)}</span> · 총 빈칸 ${blankCount(set.segments||[])}개</p>
      <div class="example-box">학생 링크: ${escapeHtml(link)}</div>
      <div style="margin-top:18px;">
        ${subs.length === 0
          ? `<div class="empty-state">아직 제출한 학생이 없어요.</div>`
          : `<table><thead><tr><th>이름</th><th>점수</th><th>정답률</th></tr></thead><tbody>${rows}</tbody></table>`}
      </div>`;
  }catch(e){
    area.innerHTML = `<div class="banner banner-error">결과를 불러오지 못했어요: ${escapeHtml(e.message)}</div>`;
  }
}

    <div class="script-box">${bodyHtml}</div>
  </div>

  <div class="btn-row">

/* ---- STUDENT: RESULT ---- */
function renderStudentResult(){
  const g = state.lastGrade;
  const set = state.currentSet;
  if(!g || !set) return `<div class="empty-state">결과가 없어요.</div>`;
  const bodyHtml = set.segments.map(seg => {
    if(seg.type === 'text') return renderTextSegment(seg.value);
    const given = g.answersByIndex[seg.index] || '';
    const isCorrect = normalize(given) === normalize(seg.answer);
    const width = Math.max(4, seg.answer.length + 2);
    const cls = isCorrect ? 'correct' : 'wrong';
    const tag = isCorrect ? '' : `<span class="answer-tag">${escapeHtml(seg.answer)}</span>`;
    return `<input class="blank-input ${cls}" style="width:${width}ch" value="${escapeHtml(given)}" disabled>${tag}`;
  }).join('');

  return `
  ${renderBackRow('home')}
  <div class="card">
    <div class="score-hero">
      <div class="score-num">${g.score} / ${g.total}</div>
      <div class="score-label">정답률 ${g.total ? Math.round(g.score/g.total*100) : 0}% · ${escapeHtml(state.studentName)}님, 수고했어요!</div>
    </div>
    <div class="script-box" style="margin-top:10px;">${bodyHtml}</div>
  </div>`;
}

/* =========================================================
   6. 이벤트 바인딩
   ========================================================= */
function attachHandlers(){
  document.querySelectorAll('[data-go]').forEach(el => {
    el.addEventListener('click', () => { state.banner = null; goto(el.dataset.go); });
  });

  // 라디오: 음원 입력 방식 전환
  document.querySelectorAll('input[name="audioMode"]').forEach(r => {
    r.addEventListener('change', (e) => { state.audioMode = e.target.value; render(); });
  });

  // Word(.docx) 파일에서 스크립트 가져오기
  const docxBtn = document.getElementById('btn-docx-import');
  const docxFileInput = document.getElementById('f-docx-file');
  if(docxBtn && docxFileInput){
    docxBtn.addEventListener('click', () => docxFileInput.click());
    docxFileInput.addEventListener('change', async () => {
      const file = docxFileInput.files[0];
      if(!file) return;
      const statusEl = document.getElementById('create-status');
      statusEl.innerHTML = `<div class="spinner"></div>`;
      try{
        const results = await docxToScripts(file);
        if(results.length === 0){
          statusEl.innerHTML = `<div class="banner banner-warn">스크립트를 찾지 못했어요.</div>`;
        } else if(results.length === 1){
          const r = results[0];
          const hasTitle = r.title && r.title !== '(제목 없음)';
          if(hasTitle) document.getElementById('f-title').value = r.title;
          document.getElementById('f-script').value = r.script;
          const blanks = blankCount(parseScript(r.script));
          statusEl.innerHTML = `<div class="banner banner-success">${hasTitle ? '제목과 ' : ''}빈칸 ${blanks}개를 자동으로 채웠어요. 확인 후 이상한 부분은 직접 고쳐주세요.</div>`;
        } else {
          document.getElementById('f-script').value = results.map(r=>r.script).join('\n\n');
          statusEl.innerHTML = `<div class="banner banner-warn">이 파일 안에 딕테이션이 ${results.length}개 감지됐어요. 한 번에 여러 세트로 만드시려면 '여러 개 가져오기' 탭을 이용해보세요. 지금은 전체를 스크립트 칸에 합쳐 넣었어요.</div>`;
        }
      }catch(e){
        statusEl.innerHTML = `<div class="banner banner-error">Word 파일을 읽지 못했어요: ${escapeHtml(e.message)}</div>`;
      }
      docxFileInput.value = '';
    });
  }

  // Word 파일 하나로 여러 세트 가져오기
  const bulkFileInput = document.getElementById('f-bulk-docx');
  if(bulkFileInput){
    bulkFileInput.addEventListener('change', async () => {
      const file = bulkFileInput.files[0];
      if(!file) return;
      const statusEl = document.getElementById('bulk-import-status');
      statusEl.innerHTML = `<div class="spinner"></div>`;
      try{
        const results = await docxToScripts(file);
        if(results.length === 0){
          state.bulkSets = [];
          statusEl.innerHTML = `<div class="banner banner-warn">딕테이션을 인식하지 못했어요. 각 제목 문단에 형광펜(하이라이트)이 칠해져 있는지 확인해주세요.</div>`;
        } else {
          state.bulkSets = results.map(r => ({ title: r.title, script: r.script }));
          statusEl.innerHTML = `<div class="banner banner-success">${results.length}개의 딕테이션을 찾았어요. 아래에서 확인하고 세트별로 음원 URL을 채운 뒤 만들어주세요.</div>`;
        }
      }catch(e){
        statusEl.innerHTML = `<div class="banner banner-error">Word 파일을 읽지 못했어요: ${escapeHtml(e.message)}</div>`;
      }
      document.getElementById('bulk-sets-area').innerHTML = renderBulkSetsList();
    });
  }

  // 여러 세트 한 번에 만들기
  const bulkCreateAllBtn = document.getElementById('btn-bulk-create-all');
  if(bulkCreateAllBtn){
    bulkCreateAllBtn.addEventListener('click', async () => {
      const titles = document.querySelectorAll('.bulk-title');
      const scripts = document.querySelectorAll('.bulk-script');
      const audios = document.querySelectorAll('.bulk-audio');
      const statusEl = document.getElementById('bulk-create-status');
      bulkCreateAllBtn.disabled = true;
      statusEl.innerHTML = `<div class="spinner"></div>`;
      let successCount = 0;
      const okLines = [];
      const errLines = [];
      for(let i=0;i<titles.length;i++){
        const title = titles[i].value.trim();
        const script = scripts[i].value;
        const audioUrl = audios[i].value.trim();
        if(!title || !script.trim() || !audioUrl){
          errLines.push(`세트 ${i+1}: 제목·스크립트·음원 URL을 모두 입력해주세요.`);
          continue;
        }
        if(parseScript(script).filter(s=>s.type==='blank').length === 0){
          errLines.push(`세트 ${i+1} (${title}): {} 로 표시된 빈칸이 없어요.`);
          continue;
        }
        try{
          const { code } = await createSet(title, script, audioUrl);
          okLines.push(`${title} → 코드 ${code}`);
          successCount++;
        }catch(e){
          errLines.push(`세트 ${i+1} (${title}): 저장 실패 - ${e.message}`);
        }
      }
      let html = '';
      if(successCount > 0){
        html += `<div class="banner banner-success">${successCount}개 세트가 만들어졌어요.<br>${okLines.map(escapeHtml).join('<br>')}</div>`;
      }
      if(errLines.length > 0){
        html += `<div class="banner banner-error">${errLines.map(escapeHtml).join('<br>')}</div>`;
      }
      statusEl.innerHTML = html;
      bulkCreateAllBtn.disabled = false;
      if(successCount > 0 && errLines.length === 0){
        setTimeout(() => goto('teacherSets'), 1200);
      }
    });
  }

  // 세트 생성
  const createBtn = document.getElementById('btn-create-set');
  if(createBtn){
    createBtn.addEventListener('click', async () => {
      const title = document.getElementById('f-title').value.trim();
      const script = document.getElementById('f-script').value;
      const statusEl = document.getElementById('create-status');
      if(!title || !script.trim()){
        statusEl.innerHTML = `<div class="banner banner-error">제목과 스크립트를 모두 입력해주세요.</div>`;
        return;
      }
      if(parseScript(script).filter(s=>s.type==='blank').length === 0){
        statusEl.innerHTML = `<div class="banner banner-error">{ } 로 표시된 빈칸이 하나도 없어요.</div>`;
        return;
      }
      createBtn.disabled = true;
      statusEl.innerHTML = `<div class="spinner"></div>`;
      try{
        let audioUrl = '';
        if(state.audioMode === 'url'){
          audioUrl = document.getElementById('f-audio-url').value.trim();
        } else {
          if(!storage){
            statusEl.innerHTML = `<div class="banner banner-error">Storage가 설정되지 않았어요. 'URL 입력'을 선택해서 mp3 링크(예: GitHub에 올린 audio/파일명.mp3)를 입력해주세요.</div>`;
            createBtn.disabled = false;
            return;
          }
          const fileInput = document.getElementById('f-audio-file');
          if(fileInput.files[0]){
            statusEl.innerHTML = `<div class="banner banner-warn">음원 업로드 중이에요... (파일 크기에 따라 시간이 걸릴 수 있어요)</div>`;
            audioUrl = await uploadAudioFile(fileInput.files[0]);
          }
        }
        if(!audioUrl){
          statusEl.innerHTML = `<div class="banner banner-error">음원 URL을 입력하거나 파일을 선택해주세요.</div>`;
          createBtn.disabled = false;
          return;
        }
        const { code } = await createSet(title, script, audioUrl);
        statusEl.innerHTML = `<div class="banner banner-success">세트가 만들어졌어요! 학생 공유 코드: <b>${code}</b></div>`;
        setTimeout(() => goto('teacherSets'), 900);
      }catch(e){
        statusEl.innerHTML = `<div class="banner banner-error">저장 중 오류가 발생했어요: ${escapeHtml(e.message)}</div>`;
        createBtn.disabled = false;
      }
    });
  }

  // 학생 입장
  const enterBtn = document.getElementById('btn-enter-quiz');
  if(enterBtn){
    enterBtn.addEventListener('click', async () => {
      const code = document.getElementById('f-code').value.trim();
      const name = document.getElementById('f-name').value.trim();
      const statusEl = document.getElementById('entry-status');
      if(!code || !name){
        statusEl.innerHTML = `<div class="banner banner-error">코드와 이름을 모두 입력해주세요.</div>`;
        return;
      }
      enterBtn.disabled = true;
      statusEl.innerHTML = `<div class="spinner"></div>`;
      try{
        const set = await fetchSetByCode(code);
        if(!set){
          statusEl.innerHTML = `<div class="banner banner-error">해당 코드의 딕테이션을 찾을 수 없어요. 코드를 다시 확인해주세요.</div>`;
          enterBtn.disabled = false;
          return;
        }
        state.studentName = name;
        goto('studentQuiz', { currentSet: set, currentSetId: set.id });
      }catch(e){
        statusEl.innerHTML = `<div class="banner banner-error">오류가 발생했어요: ${escapeHtml(e.message)}</div>`;
        enterBtn.disabled = false;
      }
    });
  }

  // 퀴즈 화면: 오디오 컨트롤
  const audioEl = document.getElementById('quiz-audio');
  const waveEl = document.getElementById('waveform');
  if(audioEl){
    audioEl.addEventListener('play', () => waveEl && waveEl.classList.add('playing'));
    audioEl.addEventListener('pause', () => waveEl && waveEl.classList.remove('playing'));
    audioEl.addEventListener('ended', () => waveEl && waveEl.classList.remove('playing'));
    const replayBtn = document.getElementById('btn-replay');
    if(replayBtn) replayBtn.addEventListener('click', () => { audioEl.currentTime = 0; audioEl.play(); });
    const rateSel = document.getElementById('playback-rate');
    if(rateSel) rateSel.addEventListener('change', () => { audioEl.playbackRate = parseFloat(rateSel.value); });
  }

  // 퀴즈 제출 → 채점
  const submitBtn = document.getElementById('btn-submit-quiz');
  if(submitBtn){
    submitBtn.addEventListener('click', async () => {
      const set = state.currentSet;
      const inputs = document.querySelectorAll('.blank-input[data-blank]');
      const answersByIndex = {};
      inputs.forEach(inp => { answersByIndex[inp.dataset.blank] = inp.value; });

      let score = 0, total = 0;
      set.segments.filter(s=>s.type==='blank').forEach(seg => {
        total++;
        if(normalize(answersByIndex[seg.index]) === normalize(seg.answer)) score++;
      });

      submitBtn.disabled = true;
      const statusEl = document.getElementById('quiz-status');
      statusEl.innerHTML = `<div class="spinner"></div>`;
      try{
        await saveSubmission(state.currentSetId, state.studentName, score, total, answersByIndex);
        state.lastGrade = { score, total, answersByIndex };
        goto('studentResult');
      }catch(e){
        statusEl.innerHTML = `<div class="banner banner-error">채점 결과 저장 중 오류: ${escapeHtml(e.message)}</div>`;
        submitBtn.disabled = false;
      }
    });
  }
}

/* =========================================================
   7. 시작 — URL에 ?set=문서ID 가 있으면 학생 화면으로 바로 진입
   ========================================================= */
async function boot(){
  render();
  if(CONFIG_IS_PLACEHOLDER) return;
  const params = new URLSearchParams(location.search);
  const setId = params.get('set');
  if(setId){
    const area = document.getElementById('app');
    try{
      const set = await fetchSetById(setId);
      if(set){
        const name = prompt('이름을 입력하세요');
        if(name && name.trim()){
          state.studentName = name.trim();
          goto('studentQuiz', { currentSet: set, currentSetId: set.id });
          return;
        }
      }
    }catch(e){ /* fall through to home */ }
    goto('home');
  }
}
boot();
</script>
