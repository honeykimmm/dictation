<style>
  :root{
    --bg: #EDF2F1;
    --paper: #FFFFFF;
    --ink: #1F2A37;
    --ink-soft: #5B6675;
    --line: #DCE3E1;
    --navy: #2B3A67;
    --navy-deep: #1C2848;
    --amber: #E2A33B;
    --amber-soft: #FBEBCF;
    --success: #3F9169;
    --success-soft: #E4F3EB;

    background-image:

  .listen-controls select{ background:#22315a; color:#fff; border:1px solid #3c4d81; border-radius:8px; padding:6px 8px; font-size:0.82rem; }
  .listen-controls .btn-ghost{ background:#22315a; border-color:#3c4d81; color:#fff; padding:7px 12px; font-size:0.82rem; }

  /* ---- Dictation text / blanks ---- */

  /* ---- Score ---- */
  .score-hero{ text-align:center; padding: 26px 10px 8px; }

  /* ---- Results table ---- */

<script>
/* =========================================================
   1. FIREBASE 설정
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCyEe3wyJkfzUPEjEMxzlglsW-TJ96EVOw",
  authDomain: "dictation-bb4c5.firebaseapp.com",
  projectId: "dictation-bb4c5",
  storageBucket: "dictation-bb4c5.firebasestorage.app",
  messagingSenderId: "438431222493",
  appId: "1:438431222493:web:5bce01341983549ba72934"
};

const CONFIG_IS_PLACEHOLDER = firebaseConfig.apiKey === "YOUR_API_KEY";
let db, storage;
if (!CONFIG_IS_PLACEHOLDER) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  try { storage = firebase.storage(); } catch(e) { storage = null; } // Storage 미설정이어도 Firestore는 정상 동작
}

// 선생님 목록 — 이름·비밀번호를 원하는 값으로 바꾸거나 필요한 만큼 추가하세요 (보안용이 아니라 학생들이 실수로 못 들어오게 하는 정도예요)
const TEACHERS = [
  { name: "김현채", password: "0486" },
  { name: "김예진", password: "0607" }
];

/* =========================================================
   2. 상태
   ========================================================= */
const state = {
  view: 'home',       // home | teacherCreate | teacherSets | teacherResults | studentEntry | studentQuiz | studentResult
  currentSet: null,   // {id, code, title, segments, audioUrl}
  currentSetId: null,
  studentName: '',
  studentTeacherName: '',
  lastGrade: null,    // {score, total, segments(graded)}
  banner: null,
  audioMode: 'url',   // url | upload
  bulkSets: [],       // Word 일괄 가져오기로 인식된 세트 목록
  importDraft: { title:'', script:'', audioUrl:'' }, // 단일 세트 화면에서 Word로 가져온 값 프리필용
  currentTeacherName: null
};

/* =========================================================
   3. 유틸
   ========================================================= */
function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalize(str){
  return (str||'').trim().toLowerCase().replace(/\s+/g,' ');
}
function genCode(len=6){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let out = '';
  for(let i=0;i<len;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}
// {정답} 형식으로 표시된 스크립트를 세그먼트 배열로 변환
function parseScript(raw){
  const segments = [];
  const regex = /\{([^}]+)\}/g;
  let lastIndex = 0, match, blankIndex = 0;
  while((match = regex.exec(raw)) !== null){
    if(match.index > lastIndex){
      segments.push({ type:'text', value: raw.slice(lastIndex, match.index) });
    }
    segments.push({ type:'blank', answer: match[1].trim(), index: blankIndex++ });
    lastIndex = regex.lastIndex;
  }
  if(lastIndex < raw.length){
    segments.push({ type:'text', value: raw.slice(lastIndex) });
  }
  return segments;
}
function blankCount(segments){
  return segments.filter(s => s.type === 'blank').length;
}

// Word(.docx) 내부 XML을 직접 읽어서 처리 (mammoth 대신 — 음영/하이라이트, 잘게 쪼개진 밑줄 단어를 정확히 잡기 위함)
const W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const AUDIO_FILENAME_RE = /^([\w\-]+\.(mp3|wav|m4a|ogg))$/i;
// Word 안에 적힌 파일명(예: CH6_2D.mp3) 앞에 붙여서 실제 업로드한 파일명과 맞출 접두사
const AUDIO_FILENAME_PREFIX = "Decoding TOEFL LInter_";

function docxIsUnderlined(rPr){
  if(!rPr) return false;
  const u = rPr.getElementsByTagNameNS(W_NS, 'u')[0];
  if(!u) return false;
  const val = u.getAttributeNS(W_NS, 'val');
  return !!val && val !== 'none';
}
function docxIsShaded(rPr){
  if(!rPr) return false;
  const shd = rPr.getElementsByTagNameNS(W_NS, 'shd')[0];
  if(!shd) return false;
  const val = shd.getAttributeNS(W_NS, 'val');
  return !!val && val !== 'clear' && val !== 'nil';
}
// 문단 하나를 {ch, underline, shaded} 문자 배열로 변환 (줄바꿈/탭 포함)
function docxParseParagraph(p){
  const runs = Array.from(p.getElementsByTagNameNS(W_NS, 'r'));
  const chars = [];
  runs.forEach(run => {
    const rPr = run.getElementsByTagNameNS(W_NS, 'rPr')[0];
    const underline = docxIsUnderlined(rPr);
    const shaded = docxIsShaded(rPr);
    Array.from(run.childNodes).forEach(node => {
      const local = node.localName;
      if(local === 't'){
        for(const ch of (node.textContent||'')) chars.push({ ch, underline, shaded });
      } else if(local === 'br' || local === 'cr'){
        chars.push({ ch:'\n', underline:false, shaded:false });
      } else if(local === 'tab'){
        chars.push({ ch:' ', underline:false, shaded:false });
      }
    });
  });
  return chars;
}
function docxCharsToPlainText(chars){ return chars.map(c=>c.ch).join(''); }
function docxShadedRatio(chars){
  const text = docxCharsToPlainText(chars).trim();
  if(!text) return 0;
  const shadedText = chars.filter(c=>c.shaded).map(c=>c.ch).join('').trim();
  return shadedText.length / text.length;
}
// 연속된 밑줄 문자를 하나로 합쳐 {정답}으로 변환 (워드가 단어 중간에서 런을 쪼개도 정상 병합됨)
function docxCharsToScriptLine(chars){
  let out = '';
  let i = 0;
  while(i < chars.length){
    if(chars[i].underline){
      let group = '';
      while(i < chars.length && chars[i].underline){ group += chars[i].ch; i++; }
      const trimmed = group.trim();
      out += trimmed ? '{' + trimmed + '}' : group;
    } else {
      out += chars[i].ch; i++;
    }
  }
  return out;
}
async function docxReadParagraphs(file){
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const entry = zip.file('word/document.xml');
  if(!entry) throw new Error('올바른 .docx 파일이 아니에요.');
  const xmlText = await entry.async('text');
  const xmlDoc = new DOMParser().parseFromString(xmlText, 'application/xml');
  return Array.from(xmlDoc.getElementsByTagNameNS(W_NS, 'p')).map(docxParseParagraph);
}

// Word(.docx) 한 파일 안에 여러 딕테이션이 있을 때, 음영(하이라이트) 친 제목 문단을 기준으로 분리
// 섹션 맨 윗줄이 'xxx.mp3' 같은 파일명이면 자동으로 떼서 음원 URL 후보로 사용
async function docxToScripts(file){
  const paragraphsChars = await docxReadParagraphs(file);
  const sets = [];
  let current = null;
  paragraphsChars.forEach(chars => {
    const text = docxCharsToPlainText(chars).trim();
    if(!text) return;
    const isTitle = docxShadedRatio(chars) >= 0.5;
    if(isTitle){
      const cleanTitle = text.replace(/^[\s.·•‣▪:-]+/, '').trim() || `세트 ${sets.length+1}`;
      current = { title: cleanTitle, lines: [] };
      sets.push(current);
      return;
    }
    if(!current){
      current = { title: '(제목 없음)', lines: [] };
      sets.push(current);
    }
    current.lines.push(docxCharsToScriptLine(chars));
  });
  return sets.map(s => {
    const lines = s.lines.slice();
    let audioUrl = '';
    if(lines.length){
      const m = AUDIO_FILENAME_RE.exec(lines[0].trim());
      if(m){ audioUrl = 'audio/' + encodeURIComponent(AUDIO_FILENAME_PREFIX + m[1]); lines.shift(); }
    }
    return { title: s.title, script: lines.join('\n').trim(), audioUrl };
  }).filter(s => s.script);
}
function renderTextSegment(value){
  return escapeHtml(value).replace(/\n/g, '<br>');
}
// segments + 학생이 입력한 answers를 채점된 스크립트 HTML로 변환 (학생 결과 화면 · 교사 인쇄에서 공용)
function renderGradedScriptHtml(segments, answersByIndex){
  answersByIndex = answersByIndex || {};
  return (segments||[]).map(seg => {
    if(seg.type === 'text') return renderTextSegment(seg.value);
    const given = answersByIndex[seg.index] || '';
    const isCorrect = normalize(given) === normalize(seg.answer);
    const width = Math.max(4, seg.answer.length + 2);
    const cls = isCorrect ? 'correct' : 'wrong';
    const tag = isCorrect ? '' : `<span class="answer-tag">${escapeHtml(seg.answer)}</span>`;
    return `<input class="blank-input ${cls}" style="width:${width}ch" value="${escapeHtml(given)}" disabled>${tag}`;
  }).join('');
}
function setBanner(type, msg){ state.banner = {type, msg}; }

/* =========================================================
   4. Firestore / Storage 연동
   ========================================================= */
async function createSet(title, rawScript, audioUrl){
  const segments = parseScript(rawScript);
  const code = genCode();
  const docRef = await db.collection('dictationSets').add({
    title, code, segments, audioUrl,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  return { id: docRef.id, code };
}
async function updateSet(id, title, rawScript, audioUrl){
  const segments = parseScript(rawScript);
  await db.collection('dictationSets').doc(id).update({ title, segments, audioUrl });
}
async function deleteSet(id){
  const subSnap = await db.collection('dictationSets').doc(id).collection('submissions').get();
  const batch = db.batch();
  subSnap.docs.forEach(d => batch.delete(d.ref));
  batch.delete(db.collection('dictationSets').doc(id));
  await batch.commit();
}
// 저장된 segments 배열을 다시 {정답} 형식 원본 스크립트 텍스트로 복원 (수정 화면용)
function segmentsToRawScript(segments){
  return (segments||[]).map(s => s.type === 'blank' ? '{' + s.answer + '}' : s.value).join('');
}
async function fetchSets(){
  const snap = await db.collection('dictationSets').orderBy('createdAt','desc').limit(50).get();
  return snap.docs.map(d => ({ id:d.id, ...d.data() }));
}
async function fetchSetById(id){
  const doc = await db.collection('dictationSets').doc(id).get();
  if(!doc.exists) return null;
  return { id: doc.id, ...doc.data() };
}
async function fetchSetByCode(code){
  const snap = await db.collection('dictationSets').where('code','==', code.trim().toUpperCase()).limit(1).get();
  if(snap.empty) return null;
  const d = snap.docs[0];
  return { id: d.id, ...d.data() };
}
async function saveSubmission(setId, studentName, teacherName, score, total, answers){
  await db.collection('dictationSets').doc(setId).collection('submissions').add({
    studentName, teacherName, score, total, answers,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}
async function fetchSubmissions(setId){
  const snap = await db.collection('dictationSets').doc(setId).collection('submissions').orderBy('score','desc').get();
  return snap.docs.map(d => ({ id:d.id, ...d.data() }));
}
// 특정 학생(같은 선생님 소속)이 지금까지 제출한 모든 세트의 결과를 모아서 가져오기 (리포트 카드용)
async function fetchStudentSubmissions(studentName, teacherName){
  const snap = await db.collectionGroup('submissions')
    .where('studentName', '==', studentName)
    .where('teacherName', '==', teacherName)
    .get();
  const rows = snap.docs.map(d => ({ id: d.id, setId: d.ref.parent.parent.id, ...d.data() }));
  const uniqueSetIds = [...new Set(rows.map(r => r.setId))];
  const setDocs = await Promise.all(uniqueSetIds.map(id => fetchSetById(id)));
  const titleById = {};
  uniqueSetIds.forEach((id, i) => { titleById[id] = setDocs[i] ? setDocs[i].title : '(삭제된 세트)'; });
  rows.forEach(r => { r.setTitle = titleById[r.setId] || '(삭제된 세트)'; });
  rows.sort((a,b) => {
    const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
    const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
    return ta - tb;
  });
  return rows;
}
async function uploadAudioFile(file){
  const path = 'dictation-audio/' + Date.now() + '_' + file.name.replace(/[^\w.\-]/g,'_');
  const ref = storage.ref().child(path);
  await ref.put(file);
  return await ref.getDownloadURL();
}

function goto(view, extra){
  state.view = view;
  Object.assign(state, extra||{});
  render();
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = renderHeader() + renderBanner() + renderView();
  attachHandlers();
}

function renderHeader(){
  return `
  <div class="app-header">
    <div class="brand-mark"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
    <div>

    </div>

function renderBanner(){
  if(!state.banner) return '';
  const b = state.banner;
  const cls = b.type === 'error' ? 'banner-error' : b.type === 'success' ? 'banner-success' : 'banner-warn';
  return `<div class="banner ${cls}">${escapeHtml(b.msg)}</div>`;
}

function renderView(){
  if(CONFIG_IS_PLACEHOLDER){
    return `
    <div class="banner banner-warn">
      <b>설정이 필요해요.</b> 코드 상단의 <code>firebaseConfig</code> 값을 본인의 Firebase 프로젝트 정보로 바꿔주세요.
      Firestore와 Storage를 프로젝트에서 사용 설정한 뒤 다시 열어보세요.
    </div>`;
  }
  switch(state.view){
    case 'home': return renderHome();
    case 'teacherAuth': return renderTeacherAuth();
    case 'teacherCreate': return renderTeacherCreate();
    case 'teacherBulkImport': return renderTeacherBulkImport();
    case 'teacherSets': return renderTeacherSets();
    case 'teacherStudentReport': return renderTeacherStudentReport();
    case 'teacherEditSet': return renderTeacherEditSetShell();
    case 'teacherResults': return renderTeacherResultsShell();
    case 'studentEntry': return renderStudentEntryShell();
    case 'studentQuiz': return renderStudentQuiz();
    case 'studentResult': return renderStudentResult();
    default: return renderHome();
  }
}

    });
    area.querySelectorAll('[data-goto-edit]').forEach(btn => {
      btn.addEventListener('click', () => goto('teacherEditSet', { currentSetId: btn.dataset.gotoEdit }));
    });
    area.querySelectorAll('[data-delete-set]').forEach(btn => {

        btn.disabled = true;

          alert('삭제 중 오류가 발생했어요: ' + e.message);

async function loadTeacherResults(){
  const area = document.getElementById('results-area');
  if(!area || !state.currentSetId) return;
  try{
    const [set, allSubs, roster] = await Promise.all([
      fetchSetById(state.currentSetId),
      fetchSubmissions(state.currentSetId),
      fetchRoster(state.currentTeacherName)
    ]);
    const subs = allSubs.filter(s => s.teacherName === state.currentTeacherName);
    if(!set){ area.innerHTML = `<div class="empty-state">세트를 찾을 수 없어요.</div>`; return; }
    const link = location.origin + location.pathname + '?set=' + set.id;

    const subByName = {};
    subs.forEach(s => { subByName[s.studentName] = s; });
    const rosterRows = roster.map(name => ({ name, sub: subByName[name] || null }));
    const extraSubs = subs.filter(s => !roster.includes(s.studentName));
    const doneCount = rosterRows.filter(r => r.sub).length;

    let rowsHtml = '';
    const idxToSub = [];
    rosterRows.forEach(r => {
      if(r.sub){
        rowsHtml += `
        <tr>
          <td><input type="checkbox" class="sub-select" data-idx="${idxToSub.length}"></td>
          <td>${escapeHtml(r.name)}</td>
          <td>${r.sub.score} / ${r.sub.total}</td>
          <td>${r.sub.total ? Math.round(r.sub.score/r.sub.total*100) : 0}%</td>
        </tr>`;
        idxToSub.push(r.sub);
      } else {
        rowsHtml += `
        <tr style="opacity:0.55;">
          <td></td>
          <td>${escapeHtml(r.name)}</td>
          <td colspan="2" style="font-style:italic; color:var(--ink-soft);">미제출</td>
        </tr>`;
      }
    });
    extraSubs.forEach(s => {
      rowsHtml += `
      <tr>
        <td><input type="checkbox" class="sub-select" data-idx="${idxToSub.length}"></td>
        <td>${escapeHtml(s.studentName)} <span class="muted" style="font-size:0.72rem;">(명단 외)</span></td>
        <td>${s.score} / ${s.total}</td>
        <td>${s.total ? Math.round(s.score/s.total*100) : 0}%</td>
      </tr>`;
      idxToSub.push(s);
    });

    area.innerHTML = `
      <div class="eyebrow">결과 보기</div>
      <h2>${escapeHtml(set.title||'(제목 없음)')}</h2>
      <p class="muted">학생 공유 코드 <span class="code-pill">${escapeHtml(set.code)}</span> · 총 빈칸 ${blankCount(set.segments||[])}개</p>

        ${roster.length === 0

          : `<p class="muted" style="margin-bottom:10px;">등록 ${roster.length}명 중 제출 완료 <b>${doneCount}명</b>, 미제출 ${roster.length - doneCount}명</p>`}
        <button class="btn btn-ghost" id="btn-toggle-roster-edit">${roster.length === 0 ? '명단 등록하기' : '명단 수정'}</button>
        <div id="roster-edit-area" style="display:none; margin-top:12px;">

          ? `<div class="empty-state">아직 우리 반 학생 중 제출한 사람이 없어요.</div>`
          : `<table><thead><tr><th><input type="checkbox" id="select-all-subs"></th><th>이름</th><th>점수</th><th>정답률</th></tr></thead><tbody>${rowsHtml}</tbody></table>
             <div class="btn-row" style="margin-top:14px;">
               <button class="btn btn-primary" id="btn-print-selected">🖨️ 선택한 학생 결과 인쇄 / PDF</button>
             </div>`}
      </div>`;

    const toggleBtn = document.getElementById('btn-toggle-roster-edit');
    const rosterEditArea = document.getElementById('roster-edit-area');
    if(toggleBtn && rosterEditArea){

        rosterEditArea.style.display = rosterEditArea.style.display === 'none' ? 'block' : 'none';

    const saveRosterBtn = document.getElementById('btn-save-roster');

    if(printSelectedBtn){

        const idxs = Array.from(document.querySelectorAll('.sub-select:checked')).map(cb => parseInt(cb.dataset.idx, 10));
        if(idxs.length === 0){ alert('인쇄할 학생을 먼저 선택해주세요.'); return; }
        const selectedSubs = idxs.map(i => idxToSub[i]);
        const pagesHtml = selectedSubs.map(s => `
          <div class="print-page card">
            <h2>${escapeHtml(set.title||'')}</h2>
            <div class="score-hero">
              <div class="score-num">${s.score} / ${s.total}</div>
              <div class="score-label">정답률 ${s.total ? Math.round(s.score/s.total*100) : 0}% · ${escapeHtml(s.studentName)}</div>
            </div>
            <div class="script-box" style="margin-top:10px;">${renderGradedScriptHtml(set.segments, s.answers)}</div>
          </div>
        `).join('');
        document.getElementById('print-area').innerHTML = pagesHtml;
        document.body.classList.add('printing-batch');
        window.print();
      });
    }
  }catch(e){
    area.innerHTML = `<div class="banner banner-error">결과를 불러오지 못했어요: ${escapeHtml(e.message)}</div>`;

      </label>

        <button class="btn btn-primary" id="btn-save-edit">저장하기</button>
      </div>
      <div id="edit-status"></div>`;
    document.getElementById('btn-save-edit').addEventListener('click', async () => {
      const title = document.getElementById('edit-title').value.trim();
      const script = document.getElementById('edit-script').value;
      const audioUrl = document.getElementById('edit-audio').value.trim();
      const statusEl = document.getElementById('edit-status');
      if(!title || !script.trim() || !audioUrl){
        statusEl.innerHTML = `<div class="banner banner-error">제목·스크립트·음원 URL을 모두 입력해주세요.</div>`;
        return;
      }
      if(parseScript(script).filter(s=>s.type==='blank').length === 0){
        statusEl.innerHTML = `<div class="banner banner-error">{ } 로 표시된 빈칸이 하나도 없어요.</div>`;
        return;
      }
      statusEl.innerHTML = `<div class="spinner"></div>`;
      try{
        await updateSet(state.currentSetId, title, script, audioUrl);
        statusEl.innerHTML = `<div class="banner banner-success">저장했어요!</div>`;
        setTimeout(() => goto('teacherSets'), 700);
      }catch(e){
        statusEl.innerHTML = `<div class="banner banner-error">저장 중 오류: ${escapeHtml(e.message)}</div>`;
      }
    });
  }catch(e){
    area.innerHTML = `<div class="banner banner-error">불러오지 못했어요: ${escapeHtml(e.message)}</div>`;
  }
}

/* =========================================================
   6. 이벤트 바인딩
   ========================================================= */
function attachHandlers(){
  document.querySelectorAll('[data-go]').forEach(el => {
    el.addEventListener('click', () => { state.banner = null; goto(el.dataset.go); });
  });

  // 선생님 카드: 비밀번호 확인 후에만 입장
  const enterTeacherBtn = document.getElementById('btn-enter-teacher');
  if(enterTeacherBtn){
    enterTeacherBtn.addEventListener('click', () => {
      state.banner = null;
      goto(state.currentTeacherName ? 'teacherCreate' : 'teacherAuth');
    });
  }
  const teacherAuthBtn = document.getElementById('btn-teacher-auth');
  const teacherPwInput = document.getElementById('f-teacher-pw');
  if(teacherAuthBtn && teacherPwInput){
    const tryAuth = () => {
      const match = TEACHERS.find(t => t.password === teacherPwInput.value);
      if(match){
        state.currentTeacherName = match.name;
        goto('teacherCreate');
      } else {
        document.getElementById('teacher-auth-status').innerHTML = `<div class="banner banner-error">비밀번호가 틀렸어요.</div>`;
      }
    };
    teacherAuthBtn.addEventListener('click', tryAuth);
    teacherPwInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') tryAuth(); });
  }

  // 학생 카드: 직접 들어올 때는 이전에 남아있던 링크용 세트 정보를 초기화
  const enterStudentBtn = document.getElementById('btn-enter-student');
  if(enterStudentBtn){
    enterStudentBtn.addEventListener('click', () => {
      state.banner = null;
      goto('studentEntry', { currentSet: null, currentSetId: null });
    });
  }

  // 라디오: 음원 입력 방식 전환
  document.querySelectorAll('input[name="audioMode"]').forEach(r => {
    r.addEventListener('change', (e) => { state.audioMode = e.target.value; render(); });
  });

  // Word(.docx) 파일에서 스크립트 가져오기
  const docxBtn = document.getElementById('btn-docx-import');
  const docxFileInput = document.getElementById('f-docx-file');
  if(docxBtn && docxFileInput){
    docxBtn.addEventListener('click', () => docxFileInput.click());
    docxFileInput.addEventListener('change', async () => {
      const file = docxFileInput.files[0];
      if(!file) return;
      const statusEl = document.getElementById('create-status');
      statusEl.innerHTML = `<div class="spinner"></div>`;
      try{
        const results = await docxToScripts(file);
        if(results.length === 0){
          statusEl.innerHTML = `<div class="banner banner-warn">스크립트를 찾지 못했어요.</div>`;
        } else if(results.length === 1){
          const r = results[0];
          const hasTitle = r.title && r.title !== '(제목 없음)';
          state.importDraft = { title: hasTitle ? r.title : '', script: r.script, audioUrl: r.audioUrl || '' };
          if(r.audioUrl) state.audioMode = 'url';
          const blanks = blankCount(parseScript(r.script));
          const filledParts = [];
          if(hasTitle) filledParts.push('제목');
          if(r.audioUrl) filledParts.push('음원 URL');
          const prefix = filledParts.length ? filledParts.join('·') + '과 ' : '';
          state.banner = { type:'success', msg: `${prefix}빈칸 ${blanks}개를 자동으로 채웠어요. 확인 후 이상한 부분은 직접 고쳐주세요.` };
          render();
          return;
        } else {
          state.importDraft = { title:'', script: results.map(r=>r.script).join('\n\n'), audioUrl:'' };
          state.banner = { type:'warn', msg: `이 파일 안에 딕테이션이 ${results.length}개 감지됐어요. 한 번에 여러 세트로 만드시려면 '여러 개 가져오기' 탭을 이용해보세요. 지금은 전체를 스크립트 칸에 합쳐 넣었어요.` };
          render();
          return;
        }
      }catch(e){
        statusEl.innerHTML = `<div class="banner banner-error">Word 파일을 읽지 못했어요: ${escapeHtml(e.message)}</div>`;
      }
      docxFileInput.value = '';
    });
  }

  // Word 파일 하나로 여러 세트 가져오기
  const bulkFileInput = document.getElementById('f-bulk-docx');
  if(bulkFileInput){
    bulkFileInput.addEventListener('change', async () => {
      const file = bulkFileInput.files[0];
      if(!file) return;
      const statusEl = document.getElementById('bulk-import-status');
      statusEl.innerHTML = `<div class="spinner"></div>`;
      try{
        const results = await docxToScripts(file);
        if(results.length === 0){
          state.bulkSets = [];
          statusEl.innerHTML = `<div class="banner banner-warn">딕테이션을 인식하지 못했어요. 각 제목 문단에 형광펜(하이라이트)이 칠해져 있는지 확인해주세요.</div>`;
        } else {
          state.bulkSets = results.map(r => ({ title: r.title, script: r.script, audioUrl: r.audioUrl || '' }));
          statusEl.innerHTML = `<div class="banner banner-success">${results.length}개의 딕테이션을 찾았어요. 아래에서 확인하고 세트별로 음원 URL을 채운 뒤 만들어주세요.</div>`;
        }
      }catch(e){
        statusEl.innerHTML = `<div class="banner banner-error">Word 파일을 읽지 못했어요: ${escapeHtml(e.message)}</div>`;
      }
      document.getElementById('bulk-sets-area').innerHTML = renderBulkSetsList();
    });
  }

  // 여러 세트 한 번에 만들기
  const bulkCreateAllBtn = document.getElementById('btn-bulk-create-all');
  if(bulkCreateAllBtn){
    bulkCreateAllBtn.addEventListener('click', async () => {
      const titles = document.querySelectorAll('.bulk-title');
      const scripts = document.querySelectorAll('.bulk-script');
      const audios = document.querySelectorAll('.bulk-audio');
      const statusEl = document.getElementById('bulk-create-status');
      bulkCreateAllBtn.disabled = true;
      statusEl.innerHTML = `<div class="spinner"></div>`;
      let successCount = 0;
      const okLines = [];
      const errLines = [];
      for(let i=0;i<titles.length;i++){
        const title = titles[i].value.trim();
        const script = scripts[i].value;
        const audioUrl = audios[i].value.trim();
        if(!title || !script.trim() || !audioUrl){
          errLines.push(`세트 ${i+1}: 제목·스크립트·음원 URL을 모두 입력해주세요.`);
          continue;
        }
        if(parseScript(script).filter(s=>s.type==='blank').length === 0){
          errLines.push(`세트 ${i+1} (${title}): {} 로 표시된 빈칸이 없어요.`);
          continue;
        }
        try{
          const { code } = await createSet(title, script, audioUrl);
          okLines.push(`${title} → 코드 ${code}`);
          successCount++;
        }catch(e){
          errLines.push(`세트 ${i+1} (${title}): 저장 실패 - ${e.message}`);
        }
      }
      let html = '';
      if(successCount > 0){
        html += `<div class="banner banner-success">${successCount}개 세트가 만들어졌어요.<br>${okLines.map(escapeHtml).join('<br>')}</div>`;
      }
      if(errLines.length > 0){
        html += `<div class="banner banner-error">${errLines.map(escapeHtml).join('<br>')}</div>`;
      }
      statusEl.innerHTML = html;
      bulkCreateAllBtn.disabled = false;
      if(successCount > 0 && errLines.length === 0){
        setTimeout(() => goto('teacherSets'), 1200);
      }
    });
  }

  // 학생 리포트 카드 조회
  const loadReportBtn = document.getElementById('btn-load-report');
  if(loadReportBtn){
    loadReportBtn.addEventListener('click', async () => {
      const name = document.getElementById('f-report-name').value.trim();
      const statusEl = document.getElementById('report-status');
      const areaEl = document.getElementById('report-area');
      if(!name){ statusEl.innerHTML = `<div class="banner banner-error">학생 이름을 입력해주세요.</div>`; return; }
      loadReportBtn.disabled = true;
      statusEl.innerHTML = `<div class="spinner"></div>`;
      areaEl.innerHTML = '';
      try{
        const rows = await fetchStudentSubmissions(name, state.currentTeacherName);
        loadReportBtn.disabled = false;
        if(rows.length === 0){
          statusEl.innerHTML = `<div class="banner banner-warn">해당 이름으로 제출된 기록이 없어요. 이름 철자를 확인해보세요.</div>`;
          return;
        }
        statusEl.innerHTML = '';
        areaEl.innerHTML = renderReportTable(name, rows);
        const printReportBtn = document.getElementById('btn-print-report');
        if(printReportBtn){
          printReportBtn.addEventListener('click', () => {
            const quizScores = Array.from(document.querySelectorAll('.report-quiz-score')).map(inp => inp.value.trim());
            const comment = document.getElementById('report-comment').value.trim();
            const tableRowsHtml = rows.map((r,i) => {
              const dateStr = r.createdAt && r.createdAt.toDate ? r.createdAt.toDate().toLocaleDateString('ko-KR') : '-';
              return `<tr><td>${i+1}</td><td>${escapeHtml(dateStr)}</td><td>${escapeHtml(r.setTitle)}</td><td>${r.score} / ${r.total}</td><td>${escapeHtml(quizScores[i]||'')}</td></tr>`;
            }).join('');
            const printHtml = `
              <div class="print-page card">
                <h2>${escapeHtml(name)} 학생 리포트</h2>
                <table>
                  <thead><tr><th>번호</th><th>날짜</th><th>딕테이션 제목</th><th>딕테이션 점수</th><th>문제풀이 점수</th></tr></thead>
                  <tbody>${tableRowsHtml}</tbody>
                </table>
                <div style="margin-top:24px;">
                  <div style="font-weight:700; margin-bottom:6px;">Comment</div>
                  <div style="border:1px solid #ccc; border-radius:8px; padding:12px; min-height:80px; white-space:pre-wrap;">${escapeHtml(comment)}</div>
                </div>
              </div>`;
            document.getElementById('print-area').innerHTML = printHtml;
            document.body.classList.add('printing-batch');
            window.print();
          });
        }
      }catch(e){
        loadReportBtn.disabled = false;
        const msg = (e && e.message) || String(e);
        const urlMatch = msg.match(/https:\/\/[^\s]+/);
        const linkHtml = urlMatch ? `<br><a href="${escapeHtml(urlMatch[0])}" target="_blank" rel="noopener">여기를 눌러 색인 만들기</a>` : '';
        statusEl.innerHTML = `<div class="banner banner-error">조회 중 오류가 발생했어요. Firestore에 색인(index)이 필요할 수 있어요.${linkHtml}<br>${escapeHtml(msg)}</div>`;
      }
    });
  }

  // 세트 생성
  const createBtn = document.getElementById('btn-create-set');
  if(createBtn){
    createBtn.addEventListener('click', async () => {
      const title = document.getElementById('f-title').value.trim();
      const script = document.getElementById('f-script').value;
      const statusEl = document.getElementById('create-status');
      if(!title || !script.trim()){
        statusEl.innerHTML = `<div class="banner banner-error">제목과 스크립트를 모두 입력해주세요.</div>`;
        return;
      }
      if(parseScript(script).filter(s=>s.type==='blank').length === 0){
        statusEl.innerHTML = `<div class="banner banner-error">{ } 로 표시된 빈칸이 하나도 없어요.</div>`;
        return;
      }
      createBtn.disabled = true;
      statusEl.innerHTML = `<div class="spinner"></div>`;
      try{
        let audioUrl = '';
        if(state.audioMode === 'url'){
          audioUrl = document.getElementById('f-audio-url').value.trim();
        } else {
          if(!storage){
            statusEl.innerHTML = `<div class="banner banner-error">Storage가 설정되지 않았어요. 'URL 입력'을 선택해서 mp3 링크(예: GitHub에 올린 audio/파일명.mp3)를 입력해주세요.</div>`;
            createBtn.disabled = false;
            return;
          }
          const fileInput = document.getElementById('f-audio-file');
          if(fileInput.files[0]){
            statusEl.innerHTML = `<div class="banner banner-warn">음원 업로드 중이에요... (파일 크기에 따라 시간이 걸릴 수 있어요)</div>`;
            audioUrl = await uploadAudioFile(fileInput.files[0]);
          }
        }
        if(!audioUrl){
          statusEl.innerHTML = `<div class="banner banner-error">음원 URL을 입력하거나 파일을 선택해주세요.</div>`;
          createBtn.disabled = false;
          return;
        }
        const { code } = await createSet(title, script, audioUrl);
        statusEl.innerHTML = `<div class="banner banner-success">세트가 만들어졌어요! 학생 공유 코드: <b>${code}</b></div>`;
        state.importDraft = { title:'', script:'', audioUrl:'' };
        setTimeout(() => goto('teacherSets'), 900);
      }catch(e){
        statusEl.innerHTML = `<div class="banner banner-error">저장 중 오류가 발생했어요: ${escapeHtml(e.message)}</div>`;
        createBtn.disabled = false;
      }
    });
  }

  // 학생 입장
  const enterBtn = document.getElementById('btn-enter-quiz');
  if(enterBtn){
    enterBtn.addEventListener('click', async () => {
      const teacherSelect = document.getElementById('f-teacher-select');
      const teacherName = teacherSelect ? teacherSelect.value : '';
      const name = document.getElementById('f-name').value.trim();
      const statusEl = document.getElementById('entry-status');
      if(!teacherName || !name){
        statusEl.innerHTML = `<div class="banner banner-error">선생님과 이름을 모두 입력해주세요.</div>`;
        return;
      }
      state.studentName = name;
      state.studentTeacherName = teacherName;

      // 공유 링크로 바로 들어온 경우: 세트를 이미 갖고 있어서 코드 조회 없이 바로 시작
      if(state.currentSet){
        goto('studentQuiz', { currentSet: state.currentSet, currentSetId: state.currentSet.id });
        return;
      }

      const code = document.getElementById('f-code').value.trim();
      if(!code){
        statusEl.innerHTML = `<div class="banner banner-error">세트 코드를 입력해주세요.</div>`;
        return;
      }
      enterBtn.disabled = true;
      statusEl.innerHTML = `<div class="spinner"></div>`;
      try{
        const set = await fetchSetByCode(code);
        if(!set){
          statusEl.innerHTML = `<div class="banner banner-error">해당 코드의 딕테이션을 찾을 수 없어요. 코드를 다시 확인해주세요.</div>`;
          enterBtn.disabled = false;
          return;
        }
        goto('studentQuiz', { currentSet: set, currentSetId: set.id });
      }catch(e){
        statusEl.innerHTML = `<div class="banner banner-error">오류가 발생했어요: ${escapeHtml(e.message)}</div>`;
        enterBtn.disabled = false;
      }
    });
  }

  // 퀴즈 화면: 오디오 컨트롤
  const audioEl = document.getElementById('quiz-audio');
  const waveEl = document.getElementById('waveform');
  if(audioEl){
    audioEl.addEventListener('play', () => waveEl && waveEl.classList.add('playing'));
    audioEl.addEventListener('pause', () => waveEl && waveEl.classList.remove('playing'));
    audioEl.addEventListener('ended', () => waveEl && waveEl.classList.remove('playing'));
    const replayBtn = document.getElementById('btn-replay');
    if(replayBtn) replayBtn.addEventListener('click', () => { audioEl.currentTime = 0; audioEl.play(); });
    const rateSel = document.getElementById('playback-rate');
    if(rateSel) rateSel.addEventListener('change', () => { audioEl.playbackRate = parseFloat(rateSel.value); });
  }

  // 퀴즈 제출 → 채점
  const submitBtn = document.getElementById('btn-submit-quiz');
  if(submitBtn){
    submitBtn.addEventListener('click', async () => {
      const set = state.currentSet;
      const inputs = document.querySelectorAll('.blank-input[data-blank]');
      const answersByIndex = {};
      inputs.forEach(inp => { answersByIndex[inp.dataset.blank] = inp.value; });

      let score = 0, total = 0;
      set.segments.filter(s=>s.type==='blank').forEach(seg => {
        total++;
        if(normalize(answersByIndex[seg.index]) === normalize(seg.answer)) score++;
      });

      submitBtn.disabled = true;
      const statusEl = document.getElementById('quiz-status');
      statusEl.innerHTML = `<div class="spinner"></div>`;
      try{
        await saveSubmission(state.currentSetId, state.studentName, state.studentTeacherName, score, total, answersByIndex);
        state.lastGrade = { score, total, answersByIndex };
        goto('studentResult');
      }catch(e){
        statusEl.innerHTML = `<div class="banner banner-error">채점 결과 저장 중 오류: ${escapeHtml(e.message)}</div>`;
        submitBtn.disabled = false;
      }
    });
  }
  // 결과 화면: 인쇄 / PDF 저장
  const printBtn = document.getElementById('btn-print-result');
  if(printBtn){
    printBtn.addEventListener('click', () => window.print());
  }
}

/* =========================================================
   7. 시작 — URL에 ?set=문서ID 가 있으면 학생 화면으로 바로 진입
   ========================================================= */
async function boot(){
  render();
  if(CONFIG_IS_PLACEHOLDER) return;
  const params = new URLSearchParams(location.search);
  const setId = params.get('set');
  if(setId){
    try{
      const set = await fetchSetById(setId);
      if(set){
        goto('studentEntry', { currentSet: set, currentSetId: set.id });
        return;
      }
    }catch(e){ /* fall through to home */ }
    goto('home');
  }
}
boot();
window.addEventListener('afterprint', () => {
  document.body.classList.remove('printing-batch');
  const pa = document.getElementById('print-area');
  if(pa) pa.innerHTML = '';
});
</script>
</body>
